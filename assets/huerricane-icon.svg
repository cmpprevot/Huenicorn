<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </radialGradient>
    <linearGradient id="storm1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0080"/>
      <stop offset="100%" stop-color="#ff8c00"/>
    </linearGradient>
    <linearGradient id="storm2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7b2ff7"/>
    </linearGradient>
    <linearGradient id="storm3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <linearGradient id="storm4" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffe135"/>
      <stop offset="100%" stop-color="#ffc400"/>
    </linearGradient>
    <radialGradient id="eye" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="60%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fond circulaire sombre -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>

  <!-- Anneau extérieur -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#2a2a4a" stroke-width="4"/>

  <!-- Tourbillon : 4 bras incurvés style ouragan -->
  <g filter="url(#glow)">
    <path d="M 256 256
             C 256 180, 320 140, 400 160
             C 360 180, 330 220, 320 256
             C 310 292, 280 320, 256 320
             Z" fill="url(#storm1)" opacity="0.9"/>

    <path d="M 256 256
             C 332 256, 372 320, 352 400
             C 332 360, 292 330, 256 320
             C 220 310, 192 280, 192 256
             Z" fill="url(#storm2)" opacity="0.9"/>

    <path d="M 256 256
             C 256 332, 192 372, 112 352
             C 152 332, 182 292, 192 256
             C 202 220, 232 192, 256 192
             Z" fill="url(#storm3)" opacity="0.9"/>

    <path d="M 256 256
             C 180 256, 140 192, 160 112
             C 180 152, 220 182, 256 192
             C 292 202, 320 232, 320 256
             Z" fill="url(#storm4)" opacity="0.9"/>
  </g>

  <!-- Centre lumineux (œil de l'ouragan) -->
  <circle cx="256" cy="256" r="42" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="28" fill="url(#eye)"/>
  <circle cx="256" cy="256" r="14" fill="#ffffff"/>

  <!-- Petites étoiles/étincelles autour -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="120" cy="120" r="4"/>
    <circle cx="400" cy="110" r="3"/>
    <circle cx="420" cy="380" r="4"/>
    <circle cx="100" cy="400" r="3"/>
    <circle cx="380" cy="430" r="2.5"/>
    <circle cx="130" cy="390" r="2.5"/>
  </g>
</svg>
